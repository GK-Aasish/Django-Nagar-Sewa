<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    {% load static %}
    <link  href ="{% static 'src/styles.css' %}" rel="stylesheet" />
    <script src="https://kit.fontawesome.com/b480fa4bf0.js" crossorigin="anonymous"></script>

</head>

<body class="bg-gray-50">
<div id="messages-container" class="fixed top-4 right-4 z-50 space-y-2 w-96">
  {% if messages %}
    {% for message in messages %}
      <div class="toast relative flex items-start gap-3 p-3 rounded-lg shadow-lg transition-all duration-500 bg-white border-l-4
        {% if message.tags == 'error' %}
          border-red-500 text-red-700
        {% else %}
          border-green-500 text-green-700
        {% endif %}">
        
        <!-- Icon -->
        <div class="mt-1">
          {% if 'error' in message.tags %}
            <i class="fas fa-circle-exclamation"></i>
          {% else %}
            <i class="fas fa-circle-check"></i>
          {% endif %}
        </div>

        <!-- Message text -->
        <div class="flex-1 text-sm">
          {{ message }}
        </div>

        <!-- Timer bar -->
        <div class="absolute bottom-0 left-0 h-1 bg-current rounded-b-lg w-full timer-bar"></div>
      </div>
    {% endfor %}
  {% endif %}
</div>
    <!-- MAIN WRAPPER -->
    <div class="flex h-screen">
        {% include "components/sidebar.html" %}
        <main class="flex-1 flex flex-col">
          <section class="p-6 overflow-y-auto scrollbar-none">
            <div class="w-full h-[680px] bg-white border border-dashed border-gray-300 rounded-xl p-6 overflow-y-scroll scrollbar-hide">
                
            </div>
          </section>
        </main>
    </div>
    <script>
document.addEventListener("DOMContentLoaded", () => {
  const toasts = document.querySelectorAll("#messages-container .toast");
  const duration = 4000; // 4 seconds

  toasts.forEach((toast) => {
    const timerBar = toast.querySelector(".timer-bar");

    // Animate timer bar
    timerBar.style.transition = `width ${duration}ms linear`;
    setTimeout(() => {
      timerBar.style.width = '0%';
    }, 50); // slight delay to trigger transition

    // Remove toast after duration
    setTimeout(() => {
      toast.classList.add("opacity-0", "translate-x-4"); // fade + slide
      setTimeout(() => toast.remove(), 500); // remove from DOM after animation
    }, duration);
  });
});
</script>
</body>

</html>
