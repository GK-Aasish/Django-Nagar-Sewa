<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Board</title>

  {% load static %}
  <link href="{% static 'src/styles.css' %}" rel="stylesheet" />
  <script src="https://kit.fontawesome.com/b480fa4bf0.js" crossorigin="anonymous"></script>
</head>

<body class="bg-gray-50">
  <div class="flex h-screen">

    {% include "components/sidebar.html" %}

    <main class="flex-1 flex flex-col">
      <section class="p-6 overflow-y-auto scrollbar-none">

        <!-- Container -->
        <div class="w-full h-[680px] bg-white border border-dashed border-gray-300 rounded-xl overflow-y-scroll scrollbar-hide">

          <!-- Top Bar -->
          <div class="flex items-center justify-between border-b border-dashed border-gray-300 p-4">
            <h1 class="text-xl font-semibold text-gray-700">Event Board</h1>
          </div>

          <!-- Center Card -->
          <div class="flex justify-center">
            <div
              id="eventCard"
              class="relative border-l-4 rounded-xl p-5 bg-white shadow-md hover:shadow-xl transition-colors duration-300 max-w-xl w-full mt-6"
              style="border-left-color: #94a3b8;">

              <!-- Header -->
              <div class="mb-4">
                <h1 class="text-2xl font-bold text-gray-800">Create Event</h1>
                <p class="text-xs text-gray-500 mt-1">Add details for your village event</p>
              </div>

              <!-- Form -->
              <form class="space-y-4" method="post" action="{% url 'add_event' %}" enctype="multipart/form-data">
                {% csrf_token %}
                <!-- Title + Category + Preview -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-start">
                  <div class="md:col-span-2 space-y-4">
                    <!-- Title -->
                    <div>
                      <label class="block text-gray-700 font-semibold text-sm mb-1" for="title">
                        Title
                      </label>
                      <input
                        type="text"
                        id="title"
                        name="title"
                        value="{{ data.title }}"
                        placeholder="Enter event title"
                        class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                      />
                      <p class="text-red-500">{{ errors.title }} </p>
                    </div>

                    <!-- Category Dropdown -->
                    <div>
                      <label class="block text-gray-700 font-semibold text-sm mb-1" for="category">
                        Category
                      </label>
                      <select
                        id="category"
                        name="category"
                        class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                      >
                        <option value="">Select category</option>
                        {% for category in categories %}
                          <option value="{{ category.id }}"
                            {% if data.category == category.id|stringformat:"s" %}selected{% endif %}>
                            {{ category.name }}
                          </option>
                        {% endfor %}
                      </select>
                      <p class="text-red-500">{{ errors.category }} </p>
                    </div>
                  </div>

                  <!-- Preview Box -->
                  <div>
                    <label class="block text-gray-700 font-semibold text-sm mb-1">Image Preview</label>
                    <div id="imagePreviewWrap" class="h-32 w-32 rounded-md border-2 border-dashed border-gray-300 bg-gray-50 overflow-hidden flex items-center justify-center text-[10px] text-gray-500">
                      <img id="imagePreview" alt="Selected event image preview" class="h-full w-full object-cover hidden" />
                      <span id="imagePreviewPlaceholder">Preview</span>
                    </div>
                  </div>
                </div>

                <!-- Description -->
                <div>
                  <label class="block text-gray-700 font-semibold text-sm mb-1" for="description">
                    Description
                  </label>
                  <textarea
                    id="description"
                    name="description"
                    rows="4"
                    placeholder="Write event description"
                    class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                  >{{ data.description }}</textarea>
                  <p class="text-red-500">{{ errors.description }} </p>
                </div>

                <!-- Image -->
                <div>
                  <label class="block text-gray-700 font-semibold text-sm mb-1" for="image">
                    Event Image (optional)
                  </label>
                  <div class="flex items-center gap-3">
                    <input
                      type="file"
                      id="image"
                      name="image"
                      accept="image/*"
                      class="hidden"
                    />
                    <label for="image" class="inline-flex items-center justify-center px-4 py-2 bg-gray-900 text-white rounded-md text-sm font-semibold cursor-pointer hover:bg-gray-800 transition">
                      Choose Image
                    </label>
                    <span id="imageFileName" class="text-sm text-gray-500">No file chosen</span>
                  </div>
                </div>

                <!-- Event Date -->
                <div>
                  <label class="block text-gray-700 font-semibold text-sm mb-1" for="event_date">
                    Event Date & Time
                  </label>
                  <input
                    type="datetime-local"
                    id="event_date"
                    name="event_date"
                    value="{{ data.event_date }}"
                    class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                  />
                  <p class="text-red-500">{{ errors.event_date }} </p>
                </div>

                <!-- Location -->
                <div>
                  <label class="block text-gray-700 font-semibold text-sm mb-1" for="location">
                    Location
                  </label>
                  <input
                    type="text"
                    id="location"
                    name="location"
                    value="{{ data.location }}"
                    placeholder="Enter location"
                    class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                  />
                  <p class="text-red-500">{{ errors.location }} </p>
                </div>

                <!-- Submit -->
                <div class="flex justify-end">
                  <button
                    type="submit"
                    class="flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition"
                  >
                    <i class="fa-solid fa-plus"></i>
                    Create Event
                  </button>
                </div>

              </form>

            </div>
          </div>

        </div>
      </section>
    </main>
  </div>

  <!-- Script: Change border color based on category -->
  <script>
    const categorySelect = document.getElementById("category");
    const eventCard = document.getElementById("eventCard");

    const categoryColors = {
      1: "#2563eb",
      2: "#059669",
      3: "#0d9488",
      4: "#84cc16",
      5: "#06b6d4",
      6: "#f43f5e",
      7: "#f59e0b",
      8: "#d946ef"
    };

    categorySelect.addEventListener("change", function () {
      const selected = parseInt(this.value);
      eventCard.style.borderLeftColor = categoryColors[selected] || "#94a3b8";
    });
  </script>
  <script>
    const imageInput = document.getElementById("image");
    const imagePreview = document.getElementById("imagePreview");
    const imagePreviewPlaceholder = document.getElementById("imagePreviewPlaceholder");
    const imageFileName = document.getElementById("imageFileName");

    imageInput.addEventListener("change", () => {
      const file = imageInput.files && imageInput.files[0];
      if (!file) {
        imagePreview.classList.add("hidden");
        imagePreview.removeAttribute("src");
        imagePreviewPlaceholder.classList.remove("hidden");
        imageFileName.textContent = "No file chosen";
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        imagePreview.src = e.target.result;
        imagePreview.classList.remove("hidden");
        imagePreviewPlaceholder.classList.add("hidden");
        imageFileName.textContent = file.name;
      };
      reader.readAsDataURL(file);
    });
  </script>

</body>
</html>
