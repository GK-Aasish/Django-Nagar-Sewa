<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notice Board</title>

  {% load static %}
  <link href="{% static 'src/styles.css' %}" rel="stylesheet" />
  <script src="https://kit.fontawesome.com/b480fa4bf0.js" crossorigin="anonymous"></script>
</head>

<body class="bg-gray-50">
  <div class="flex h-screen">

    {% include "components/sidebar.html" %}

    <main class="flex-1 flex flex-col">
      <section class="p-6 overflow-y-auto scrollbar-none">

        <!-- Container -->
        <div class="w-full h-[680px] bg-white border border-dashed border-gray-300 rounded-xl overflow-y-scroll scrollbar-hide">

          <!-- Top Bar -->
          <div class="flex items-center justify-between border-b border-dashed border-gray-300 p-4">
            <h1 class="text-xl font-semibold text-gray-700">Notice Board</h1>
          </div>

          <!-- Center Card -->
          <div class="flex justify-center">
            <div
              id="noticeCard"
              class="relative border-l-4 rounded-xl p-6 bg-white shadow-md hover:shadow-xl transition-colors duration-300 max-w-2xl w-full mt-6"
              style="border-left-color: #94a3b8;"><!-- default slate-400 -->

              <!-- Header -->
              <div class="mb-4">
                <h1 class="text-2xl font-bold text-gray-800">Create Notice</h1>
                <p class="text-xs text-gray-500 mt-1">Add details for your village notice</p>
              </div>

              <!-- Form -->
              <form class="space-y-4" method="post" action="{% url 'add_notice' %}">
                {% csrf_token %}
                <!-- Title -->
                <div>
                  <label class="block text-gray-700 font-semibold text-sm mb-1" for="title">
                    Title
                  </label>
                  <input
                    type="text"
                    id="title"
                    name="title"
                    value = "{{data.title}}"
                    placeholder="Enter notice title"
                    class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                  />
                  <p class="text-red-500">{{errors.title}} </p>
                </div>

                <!-- Category Dropdown -->
                <div>
                  <label class="block text-gray-700 font-semibold text-sm mb-1" for="category">
                    Category
                  </label>
                  <select
                    id="category"
                    name="category"
                    class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                  >
                    <option value="">Select category</option>
                    {% for category in categories %}
                      <option value="{{ category.id }}"
                        {% if data.category == category.id|stringformat:"s" %}selected{% endif %}>
                        {{ category.name }}
                      </option>
                    {% endfor %}
                  </select>
                  <p class="text-red-500">{{errors.category}} </p>
                </div>

                <!-- Description -->
                <div>
                  <label class="block text-gray-700 font-semibold text-sm mb-1" for="description">
                    Description
                  </label>
                  <textarea
                    id="description"
                    name="description"
                    rows="5"
                    value="{{data.description}}"
                    placeholder = "Write notice description"
                    class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                  ></textarea>
                  <p class="text-red-500">{{errors.description}} </p>
                </div>

                <!-- Submit -->
                <div class="flex justify-end">
                  <button
                    type="submit"
                    class="flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition"
                  >
                    <i class="fa-solid fa-plus"></i>
                    Create Notice
                  </button>
                </div>

              </form>

            </div>
          </div>

        </div>
      </section>
    </main>
  </div>

  <!-- Script: Change border color based on category -->
  <script>
  const categorySelect = document.getElementById("category");
  const noticeCard = document.getElementById("noticeCard");

  // Map category IDs to colors
  // Replace these IDs with the actual IDs in your NoticeCategory table
  const categoryColors = {
    1: "#2563eb",  // General
    2: "#059669",  // Village Meeting
    3: "#0d9488",  // Government Scheme
    4: "#84cc16",  // Agriculture
    5: "#06b6d4",  // Water / Electricity
    6: "#f43f5e",  // Health
    7: "#f59e0b",  // Road / Sanitation
    8: "#d946ef"   // Festival / Event
  };

  categorySelect.addEventListener("change", function () {
    const selected = parseInt(this.value); // Convert string to number
    // Set the border color or fallback to default
    noticeCard.style.borderLeftColor = categoryColors[selected] || "#94a3b8"; // default slate-400
  });
</script>


</body>
</html>
