<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notice Board</title>

  {% load static %}
  <link href="{% static 'src/styles.css' %}" rel="stylesheet" />
  <script src="https://kit.fontawesome.com/b480fa4bf0.js" crossorigin="anonymous"></script>
</head>

<body class="bg-gray-50">
  <div class="flex h-screen">

    {% include "components/sidebar.html" %}

    <main class="flex-1 flex flex-col">
      <section class="p-6 overflow-y-auto scrollbar-none">

        <!-- Container -->
        <div class="w-full h-[680px] bg-white border border-dashed border-gray-300 rounded-xl overflow-y-scroll scrollbar-hide">

          <!-- Top Bar -->
          <div class="flex items-center justify-between border-b border-dashed border-gray-300 p-4">
            <h1 class="text-xl font-semibold text-gray-700">Notice Board</h1>
          </div>

          <!-- Center Card -->
          <div class="flex justify-center">
            <div
              id="noticeCard"
              class="relative border-l-4 rounded-xl p-6 bg-white shadow-md hover:shadow-xl transition-colors duration-300 max-w-2xl w-full mt-6"
              style="border-left-color: #94a3b8;"><!-- default slate-400 -->

              <!-- Header -->
              <div class="mb-4">
                <h1 class="text-2xl font-bold text-gray-800">Create Notice</h1>
                <p class="text-xs text-gray-500 mt-1">Add details for your village notice</p>
              </div>

              <!-- Form -->
              <form class="space-y-4">

                <!-- Title -->
                <div>
                  <label class="block text-gray-700 font-semibold text-sm mb-1" for="title">
                    Title
                  </label>
                  <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Enter notice title"
                    class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                  />
                </div>

                <!-- Category Dropdown -->
                <div>
                  <label class="block text-gray-700 font-semibold text-sm mb-1" for="category">
                    Category
                  </label>
                  <select
                    id="category"
                    name="category"
                    class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                  >
                    <option value="">Select category</option>
                    <option value="general">General</option>
                    <option value="meeting">Village Meeting</option>
                    <option value="government">Government Scheme</option>
                    <option value="agriculture">Agriculture</option>
                    <option value="utilities">Water / Electricity</option>
                    <option value="health">Health</option>
                    <option value="road">Road / Sanitation</option>
                    <option value="event">Festival / Event</option>
                  </select>
                </div>

                <!-- Description -->
                <div>
                  <label class="block text-gray-700 font-semibold text-sm mb-1" for="description">
                    Description
                  </label>
                  <textarea
                    id="description"
                    name="description"
                    rows="5"
                    placeholder="Write notice description"
                    class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                  ></textarea>
                </div>

                <!-- Submit -->
                <div class="flex justify-end">
                  <button
                    type="submit"
                    class="flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition"
                  >
                    <i class="fa-solid fa-plus"></i>
                    Create Notice
                  </button>
                </div>

              </form>

            </div>
          </div>

        </div>
      </section>
    </main>
  </div>

  <!-- Script: Change border color based on category -->
  <script>
    const categorySelect = document.getElementById("category");
    const noticeCard = document.getElementById("noticeCard");

    // Distinct colors for each category (inline hex values)
    const categoryColors = {
      "": "#94a3b8",       // Default slate-400
      general: "#2563eb",  // blue-600
      meeting: "#059669",  // emerald-600
      government: "#0d9488", // teal-500
      agriculture: "#84cc16", // lime-500
      utilities: "#06b6d4",   // cyan-500
      health: "#f43f5e",      // rose-500
      road: "#f59e0b",        // amber-500
      event: "#d946ef"        // fuchsia-500
    };

    categorySelect.addEventListener("change", function () {
      const selected = this.value;
      // Set inline border-left-color
      noticeCard.style.borderLeftColor = categoryColors[selected] || categoryColors[""];
    });
  </script>

</body>
</html>
