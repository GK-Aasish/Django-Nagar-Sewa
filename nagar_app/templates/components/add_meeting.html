<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Meeting</title>

  {% load static %}
  <link href="{% static 'src/styles.css' %}" rel="stylesheet" />
  <script src="https://kit.fontawesome.com/b480fa4bf0.js" crossorigin="anonymous"></script>
</head>

<body class="bg-gray-50">
  <div class="flex h-screen">

    {% include "components/sidebar.html" %}

    <main class="flex-1 flex flex-col">
      <section class="p-6 overflow-y-auto scrollbar-none">

        <!-- Container -->
        <div class="w-full h-[680px] bg-white border border-dashed border-gray-300 rounded-xl overflow-y-scroll scrollbar-hide">

          <!-- Top Bar -->
          <div class="flex items-center justify-between border-b border-dashed border-gray-300 p-4">
            <h1 class="text-xl font-semibold text-gray-700">Meetings</h1>
          </div>

          <!-- Center Card -->
          <div class="flex justify-center">
            <div
              class="relative border-l-4 rounded-xl p-5 bg-white shadow-md hover:shadow-xl transition-colors duration-300 max-w-xl w-full mt-6"
              style="border-left-color: #94a3b8;">

              <!-- Header -->
              <div class="mb-4">
                <h1 class="text-2xl font-bold text-gray-800">Create Meeting</h1>
                <p class="text-xs text-gray-500 mt-1">Add details for a new meeting</p>
              </div>

              <!-- Form -->
              <form class="space-y-4" method="post" action="{% url 'add_meeting' %}">
                {% csrf_token %}

                <!-- Title -->
                <div>
                  <label class="block text-gray-700 font-semibold text-sm mb-1" for="title">
                    Title
                  </label>
                  <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ data.title }}"
                    placeholder="Enter meeting title"
                    class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                  />
                  <p class="text-red-500">{{ errors.title }} </p>
                </div>

                <!-- Description -->
                <div>
                  <label class="block text-gray-700 font-semibold text-sm mb-1" for="description">
                    Description
                  </label>
                  <textarea
                    id="description"
                    name="description"
                    rows="4"
                    placeholder="Write meeting description"
                    class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                  >{{ data.description }}</textarea>
                  <p class="text-red-500">{{ errors.description }} </p>
                </div>

                <!-- Meeting Date -->
                <div>
                  <label class="block text-gray-700 font-semibold text-sm mb-1" for="meeting_date">
                    Meeting Date & Time
                  </label>
                  <input
                    type="datetime-local"
                    id="meeting_date"
                    name="meeting_date"
                    value="{{ data.meeting_date }}"
                    class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                  />
                  <p class="text-red-500">{{ errors.meeting_date }} </p>
                </div>

                <!-- Location -->
                <div>
                  <label class="block text-gray-700 font-semibold text-sm mb-1" for="location">
                    Location
                  </label>
                  <input
                    type="text"
                    id="location"
                    name="location"
                    value="{{ data.location }}"
                    placeholder="Enter location"
                    class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                  />
                  <p class="text-red-500">{{ errors.location }} </p>
                </div>

                <!-- Submit -->
                <div class="flex justify-end">
                  <button
                    type="submit"
                    class="flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition"
                  >
                    <i class="fa-solid fa-plus"></i>
                    Create Meeting
                  </button>
                </div>

              </form>

            </div>
          </div>

        </div>
      </section>
    </main>
  </div>
</body>
</html>
