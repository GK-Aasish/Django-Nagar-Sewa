<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>login</title>
  {% load static %}
  <link href="{% static 'src/styles.css' %}" rel="stylesheet" />
  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/b480fa4bf0.js" crossorigin="anonymous"></script>
</head>
<body class="bg-white h-screen flex items-center justify-center">
    <div id="messages-container" class="fixed top-4 right-4 z-50 space-y-2 w-96">
  {% if messages %}
    {% for message in messages %}
      <div class="toast relative flex items-start gap-3 p-3 rounded-lg shadow-lg transition-all duration-500 bg-white border-l-4
        {% if message.tags == 'error' %}
          border-red-500 text-red-700
        {% else %}
          border-green-500 text-green-700
        {% endif %}">
        
        <!-- Icon -->
        <div class="mt-1">
          {% if message.tags == 'error' %}
            <i class="fas fa-circle-exclamation"></i>
          {% else %}
            <i class="fas fa-circle-check"></i>
          {% endif %}
        </div>

        <!-- Message text -->
        <div class="flex-1 text-sm">
          {{ message }}
        </div>

        <!-- Timer bar -->
        <div class="absolute bottom-0 left-0 h-1 bg-current rounded-b-lg w-full timer-bar"></div>
      </div>
    {% endfor %}
  {% endif %}
</div>

    <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-md">
        <div class="w-full text-center">

            <div class="flex justify-center mb-6">
                <i class="fa-solid fa-handshake-angle text-indigo-600 text-5xl"></i>
            </div>

            <h2 class="text-2xl font-semibold mb-8">Log in to your account</h2>

            <form class="space-y-5" method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="text-left">
                    <label class="block text-sm font-medium mb-1">Email address</label>
                    <input type="email"
                        class="w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500"
                        name="email" value="{{ data.email }}">
                        <p class="text-red-500">{{errors.email}} </p>
                </div>

                <div class="text-left">
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <input type="password"
                        class="w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500"
                        name="password" value="{{ data.password }}">
                        <p class="text-red-500">{{errors.password}} </p>
                </div>

                <button type="submit"
                    class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700 transition">
                    Log In
                </button>
            </form>

            <p class="mt-6 text-sm">
                Not a member?
                <a href="{% url 'signup' %}" class="text-indigo-600 hover:text-indigo-800 font-medium">
                    Sign-up here..
                </a>
            </p>

        </div>
    </div>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const toasts = document.querySelectorAll("#messages-container .toast");
  const duration = 4000; // 4 seconds

  toasts.forEach((toast) => {
    const timerBar = toast.querySelector(".timer-bar");

    // Animate timer bar
    timerBar.style.transition = `width ${duration}ms linear`;
    setTimeout(() => {
      timerBar.style.width = '0%';
    }, 50); // slight delay to trigger transition

    // Remove toast after duration
    setTimeout(() => {
      toast.classList.add("opacity-0", "translate-x-4"); // fade + slide
      setTimeout(() => toast.remove(), 500); // remove from DOM after animation
    }, duration);
  });
});
</script>
</body>
</html>
